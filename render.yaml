services:
  - type: web
    name: slie-dashboard
    runtime: docker
    plan: starter
    repo: https://github.com/Isaac-Cp/Telegram
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: slie-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: slie-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_ADMIN_PASSWORD
        sync: false
      - key: DASHBOARD_CONTROL_PASSWORD
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TRUSTED_ORIGINS
        fromService:
          type: web
          name: slie-dashboard
          property: host
      - key: TRUSTED_HOSTS
        fromService:
          type: web
          name: slie-dashboard
          property: host
  - type: keyvalue
    name: slie-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

databases:
  - name: slie-db
    databaseName: slie_db
    user: slie_user
    plan: starter
